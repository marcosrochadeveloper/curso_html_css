<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner{
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
        }

        div#cxA{
            flex: 1 0 200px;

            /* flex-grow: 1;
            flex-shrink: 0;
            flex-basis: 200px; */
        }

        div#cxB{
            flex: 1 1 150px;

            /* flex-grow: 1;
            flex-shrink: 1;
            flex-basis: 150px; */
        }

        div#cxC{
            flex: 1 8 auto;

            /* flex-grow: 1;
            flex-shrink: 8;
            flex-basis: auto; */
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>



<!-- 

Caso utilize uma dessas 2 formas abaixo, será considerado como a forma padrão:
flex: 0 1 auto;
flex: initial;


Caso utilize uma dessas 2 formas abaixo, será considerado como um item não flexível:
flex: 0 0 auto;
flex: none;


Caso utilize uma dessas 2 formas abaixo, será considerado um item totalmente flexível, tanto para aumentar quanto para diminuir.
flex: 1 1 auto;
flex: auto;


Essas 2 formas no fim terão o mesmo resultado, pois o primeiro valor é referente ao flex grow.
flex: 3;
flex: 3 1 auto;

-->
